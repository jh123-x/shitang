<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<title>今天吃什么 · 湖工大食堂</title>
<style>
:root{
  --bg:#f7f5f2; --card:#fff; --ink:#16171a; --sub:#7d8087; --line:#ece7e0;
  --brand:#e2532f; --brand2:#f08a3c; --gold:#dd9b23; --soft:#fdf1ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font-family:inherit}
.app{max-width:430px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom));
     display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

header{padding:20px 2px 10px;position:relative}
h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.2px}
h1 .v{font-size:11px;font-weight:600;color:var(--brand);background:var(--soft);border-radius:20px;padding:2px 7px;vertical-align:3px;margin-left:5px}
.sub{margin-top:6px;font-size:12.5px;color:var(--sub)}

.view{display:none}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 转盘 ---------- */
.wheelbox{display:flex;flex-direction:column;align-items:center;padding:14px 0 4px}
.dialwrap{position:relative;width:236px;height:236px;display:flex;align-items:center;justify-content:center}
.pin{
  position:absolute;top:-13px;left:50%;margin-left:-8px;z-index:3;
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid var(--brand);
  filter:drop-shadow(0 2px 2px rgba(226,83,47,.3));pointer-events:none
}
.dial{
  position:relative;width:236px;height:236px;border-radius:50%;
  background:repeating-conic-gradient(#fff8f3 0deg 9deg,#ffd8bf 9deg 18deg);
  box-shadow:0 0 0 8px #fff, 0 14px 30px rgba(226,83,47,.18);
  transition:transform 1.15s cubic-bezier(.16,.74,.16,1);
  display:flex;align-items:center;justify-content:center;cursor:pointer
}
.dial:active{transform:scale(.985)}
.face{
  position:relative;z-index:2;width:172px;height:172px;border-radius:50%;background:#fff;
  box-shadow:0 3px 14px rgba(0,0,0,.07), inset 0 0 0 1px rgba(0,0,0,.03);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14px;
  transition:transform 1.15s cubic-bezier(.16,.74,.16,1);will-change:transform
}
.face .roll{font-size:26px;font-weight:800;line-height:1.22;letter-spacing:.5px;word-break:break-all}
.face .hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.face .hint b{color:var(--brand);font-weight:700}
.rolling .face .roll{opacity:.55;filter:blur(.4px)}
.tip{margin-top:14px;font-size:12.5px;color:var(--sub)}

.filters{
  display:flex;gap:7px;overflow-x:auto;padding:14px 2px 0;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%)
}
.filters.pf{padding-top:8px}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4c5159;
  padding:7px 13px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:pointer;transition:.15s
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- 结果卡 ---------- */
.result{margin-top:16px}
.res{
  background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 2px 14px rgba(22,23,26,.07);animation:pop .3s ease
}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.res .ph{position:relative;aspect-ratio:4/3;background:#f1ece6}
.res .ph.nobhoto{
  aspect-ratio:auto;height:84px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#b6afa5;background:linear-gradient(135deg,#faf6f1,#f5eee6)
}
.res .ph img{width:100%;height:100%;object-fit:cover}
.res .badge{
  position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--brand);
  display:flex;align-items:center;gap:5px
}
.res .badge span{color:var(--ink);font-weight:600}
.res .body{padding:14px 16px 16px}
.res .name{margin:0;font-size:20px;font-weight:800;line-height:1.3}
.res .where{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.res .where i{font-style:normal;background:#f4f1ec;border-radius:7px;padding:2px 7px}
.res .say{
  margin:11px 0 0;font-size:14px;line-height:1.65;color:#33363b;
  padding-left:11px;border-left:2.5px solid #ffd9c6
}
.res .meta{margin-top:12px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--sub)}
.price{color:var(--brand);font-weight:800;font-size:16px}
.price small{font-size:11px;font-weight:600;color:var(--sub);margin-left:2px}
.stars{color:var(--gold);letter-spacing:1.5px;font-size:13px}
.acts{display:flex;gap:9px;margin-top:14px}
.acts button{flex:1;border:0;border-radius:13px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer}
.b-main{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(226,83,47,.24)}
.b-ghost{background:#fff;color:var(--brand);border:1.4px solid #ffd9c6}
.placeholder{
  border:1px dashed #ddd6cd;border-radius:16px;padding:28px 18px;text-align:center;
  color:#a9abae;font-size:13px;background:transparent
}

/* ---------- 随手看 ---------- */
.peek-h{font-size:12.5px;color:var(--sub);padding:20px 2px 9px}
.peek{display:flex;gap:10px;overflow-x:auto;padding:0 2px 6px;scrollbar-width:none}
.peek::-webkit-scrollbar{display:none}
.peek .c{
  flex:0 0 108px;background:#fff;border-radius:13px;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 6px rgba(22,23,26,.05)
}
.peek .c .im{height:78px;background:#f2ede7}
.peek .c .im img{width:100%;height:100%;object-fit:cover}
.peek .c .tx{padding:8px 9px 9px}
.peek .c b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .c span{display:block;margin-top:3px;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .c em{font-style:normal;color:var(--brand);font-weight:700}

/* ---------- 榜单 ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:18px 2px 10px}
.sec-h h2{margin:0;font-size:16px;font-weight:800}
.sec-h .n{font-size:12px;color:var(--sub)}
.note{
  font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;line-height:1.6;margin-bottom:12px
}
.item{
  background:var(--card);border-radius:15px;padding:12px;margin-bottom:10px;
  display:flex;gap:12px;box-shadow:0 1px 6px rgba(22,23,26,.05);cursor:pointer
}
.item:active{background:#fdfcfa}
.thumb{
  width:64px;height:64px;border-radius:12px;overflow:hidden;flex:0 0 64px;background:#f2ede7;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#c9c2b8
}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .b{flex:1;min-width:0}
.item h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item h3 .s{
  font-size:11.5px;font-weight:800;color:#fff;background:var(--gold);border-radius:6px;padding:1px 6px
}
.item .l2{margin:3px 0 0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l3{margin:5px 0 0;font-size:12.5px;color:#4a4e55;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .l4{margin-top:6px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:#a2a5aa}

/* ---------- 食堂 ---------- */
.venue{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 6px rgba(22,23,26,.05)}
.venue>.head{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer}
.venue .t{flex:1;min-width:0}
.venue .rowtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.venue .t b{font-size:15px;font-weight:800}
.venue .t p{margin:3px 0 0;font-size:12px;color:var(--sub)}
.venue .t p.pv{margin-top:4px;font-size:11.5px;color:#b0b3b7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.venue .arrow{color:#c8c3bc;font-size:13px;transition:.2s}
.venue.open .arrow{transform:rotate(90deg)}
.venue .list{display:none;border-top:1px solid #f4f1ec;padding:4px 15px 10px}
.venue.open .list{display:block}
.flr{font-size:11.5px;color:var(--brand);background:var(--soft);border-radius:6px;padding:1px 6px;margin-left:5px;font-weight:700}
.stall{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #f2eee8}
.stall:last-child{border-bottom:0}
.stall .nm{flex:1;min-width:0;font-size:13.5px}
.stall .nm em{font-style:normal;color:var(--sub);font-size:12px;margin-left:6px}
.stall .pr{font-size:12.5px;color:var(--sub);white-space:nowrap}

/* ---------- 底部 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
}
.tabs{max-width:430px;margin:0 auto;display:flex}
.tabs button{
  flex:1;border:0;background:none;padding:13px 0 12px;font-size:13px;font-weight:700;
  color:#a3a6ab;position:relative;cursor:pointer;transition:color .15s
}
.tabs button.on{color:var(--brand)}
.tabs button.on::after{
  content:"";position:absolute;left:50%;margin-left:-11px;top:5px;width:22px;height:2.5px;
  border-radius:2px;background:var(--brand)
}

footer{margin-top:auto;padding:22px 2px 4px;font-size:11.5px;color:#a8abaf;line-height:1.8;text-align:center}

.addbtn{
  position:absolute;right:0;top:20px;
  background:#fff;border:1px solid var(--line);color:var(--sub);font-size:12px;
  padding:7px 11px;border-radius:999px;box-shadow:0 1px 6px rgba(0,0,0,.05);cursor:pointer
}
.modal{position:fixed;inset:0;background:rgba(18,18,20,.45);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.panel{background:#fff;border-radius:18px;width:100%;max-width:420px;padding:16px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.panel h3{margin:0 0 4px;font-size:16px}
.panel .hint{font-size:12px;color:var(--sub);line-height:1.65;margin-bottom:10px}
.panel .body{overflow:auto;flex:1;padding-right:2px}
.fld{margin-bottom:10px}
.fld>label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:14.5px;
  font-family:inherit;outline:none;background:#fff;color:var(--ink)
}
.fld textarea{min-height:54px;resize:none;line-height:1.5}
.row2{display:flex;gap:8px}
.row2 select{flex:1;min-width:0}
.row2 select:last-child{flex:0 0 92px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#ffb59b}
.panel .btns{display:flex;gap:8px;margin-top:10px}
.panel .btns button{flex:1;border:0;border-radius:11px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.b1{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.b2{background:#f4f1ec;color:#4c5159}
.notice{background:#fff8ec;border:1px solid #ffe3c0;border-radius:12px;padding:11px 12px;margin:0 0 11px;font-size:12.5px;line-height:1.7;color:#6a5c47}
.notice b{color:#c2410c;font-weight:700}
.notice .row{display:flex;align-items:center;gap:8px;margin-top:9px}
.notice .copy{background:#fff;border:1px solid #f0d3ad;color:#c2410c;font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer}
.notice .copy:active{background:#fff3e2}
.notice .ok{color:#2e7d32;font-size:11.5px}
.orline{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:11.5px;color:#a8abaf;white-space:nowrap}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:#f0ece6}
.mine{margin-top:10px;border-top:1px solid #f2eee8;padding-top:6px}
.mine:empty{display:none}
.mine .it{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#4c5159;padding:7px 0;border-bottom:1px dashed #f4f1ec}
.mine .it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine .it b{font-weight:600;color:var(--ink)}
.mine .del{border:0;background:none;color:#c0695f;font-size:12px;padding:2px 0;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>今天吃什么<span class="v">2.0</span></h1>
    <div class="sub" id="hdrSub">湖工大食堂 · 20 道菜 · 10 位同学投的</div>
    <button class="addbtn" id="addBtn">投稿 / 记一笔</button>
  </header>

  <!-- 转盘 -->
  <section class="view on" id="v-wheel">
    <div class="wheelbox">
      <div class="dialwrap">
        <span class="pin"></span>
        <div class="dial" id="dial">
          <div class="face">
            <div class="roll" id="roll">转</div>
            <div class="hint" id="rollHint">点一下<br><b>今天就不用想了</b></div>
          </div>
        </div>
      </div>
      <div class="tip" id="tip">按下面的条件随机，转到哪道吃哪道</div>
    </div>
    <div class="filters" id="fRegion"></div>
    <div class="filters pf" id="fPrice"></div>
    <div class="result" id="result"></div>
    <div class="peek-h" id="peekH">随手看几道</div>
    <div class="peek" id="peek"></div>
  </section>

  <!-- 榜单 -->
  <section class="view" id="v-rank">
    <div class="sec-h"><h2>按评分排</h2><span class="n" id="rankN"></span></div>
    <div id="rankNote"></div>
    <div id="rankList"></div>
  </section>

  <!-- 食堂 -->
  <section class="view" id="v-hall">
    <div class="sec-h"><h2>食堂位置</h2><span class="n" id="hallN"></span></div>
    <div id="hallList"></div>
  </section>

  <footer id="foot"></footer>
</div>

<div class="tabbar"><div class="tabs">
  <button class="on" data-v="wheel">转盘</button>
  <button data-v="rank">榜单</button>
  <button data-v="hall">食堂</button>
</div></div>

<div class="modal" id="modal">
  <div class="panel">
    <h3>投稿 / 自己记一笔</h3>
    <div class="notice" id="notice"></div>
    <div class="orline">下面这些只记在你自己手机上</div>
    <div class="body">
      <div class="fld"><label>菜名</label><input id="mDish" placeholder="例：酸菜肉丝面"></div>
      <div class="fld"><label>档口</label><input id="mStall" placeholder="例：柳州螺蛳粉"></div>
      <div class="fld"><label>在哪个食堂、几楼</label>
        <div class="row2">
          <select id="mVenue"></select>
          <select id="mFloor"><option value="">楼层</option><option>1楼</option><option>2楼</option><option>3楼</option></select>
        </div>
      </div>
      <div class="fld"><label>价格（元，不写也行）</label><input id="mPrice" type="number" inputmode="decimal" placeholder="13"></div>
      <div class="fld"><label>你给几分</label><select id="mScore"><option>5</option><option selected>4.5</option><option>4</option><option>3.5</option><option>3</option><option value="">不打分</option></select></div>
      <div class="fld"><label>一句话（可不填）</label><textarea id="mSay" maxlength="60" placeholder="例：汤头咸，面够劲，十二点排队十分钟"></textarea></div>
      <div class="mine" id="mine"></div>
    </div>
    <div class="btns" style="flex-direction:column">
      <button class="b1" id="mAdd">加进去</button>
      <div style="display:flex;gap:8px;width:100%">
        <button class="b2" id="mReset" style="flex:1">清空我加的</button>
        <button class="b2" id="mClose" style="flex:1">关闭</button>
      </div>
    </div>
  </div>
</div>

g":"r31.jpg"},{"id":"d140","venue":"楚风苑食堂","floor":"2楼","stall":"楚风苑二楼进门第一家","dish":"飘香火鸡面","price":8.9,"priceMax":8.9,"priceText":"8.9","comment":"5星必吃","score":5.0,"editor":"刹那芳华","img":"r140.jpg"},{"id":"d141","venue":"中区·右食堂","floor":"1楼","stall":"肠粉混沌","dish":"肠粉","price":6.0,"priceMax":6.0,"priceText":"6元起步","comment":"必吃","score":5.0,"editor":"刹那芳华","img":"r141.jpg"}];
var CONTACT = {"qq": "", "name": "", "group": "1107943240"};

var EXTRA_KEY = "hgd_shitang_extra_v1";
var REGION = [
  {k:"中区", m:["中区·左食堂","中区·右食堂","中区·靠七教"]},
  {k:"东区", m:["东区食堂"]},
  {k:"西区", m:["西区食堂"]},
  {k:"北区", m:["北区食堂"]},
  {k:"楚风苑", m:["楚风苑食堂"]},
  {k:"校外", m:["南区菜市场","研究生公寓楼下"]}
];
var ALL = [];

function regionOf(venue){
  for(var i=0;i<REGION.length;i++){ if(REGION[i].m.indexOf(venue)>=0) return REGION[i].k; }
  return "其他";
}
function priceText(d){
  if(d.price === null || d.price === undefined){
    return d.priceText ? '<span class="price">价格没写</span><small>原话「'+d.priceText+'」</small>' : '<span class="price">价格没写</span>';
  }
  if(d.priceMax && d.priceMax > d.price){
    return '<span class="price">¥'+fmt(d.price)+'–'+fmt(d.priceMax)+'</span>';
  }
  return '<span class="price">¥'+fmt(d.price)+'</span>';
}
function fmt(n){ return (Math.round(n*10)/10).toString(); }
function starsOf(s){
  if(!s) return "";
  var full = Math.round(s);
  var t = "";
  for(var i=0;i<5;i++){ t += i<full ? "★" : "☆"; }
  return t;
}
function whereText(d){ return d.venue + (d.floor ? " " + d.floor : ""); }

/* ---------- 转盘 ---------- */
var state = {region:"全部", price:"全部"};
var PRICE_BANDS = ["全部","¥10 以内","¥10–15","¥15 以上","没写价"];
function bandOf(d){
  if(d.price === null || d.price === undefined) return "没写价";
  var p = d.price;
  return p <= 10 ? "¥10 以内" : (p <= 15 ? "¥10–15" : "¥15 以上");
}
function pool(){
  return ALL.filter(function(d){
    if(state.region !== "全部" && regionOf(d.venue) !== state.region) return false;
    if(state.price !== "全部" && bandOf(d) !== state.price) return false;
    return true;
  });
}

function renderFilters(){
  var r1 = document.getElementById("fRegion");
  var r2 = document.getElementById("fPrice");
  var h1 = "", h2 = "";
  ["全部"].concat(REGION.map(function(r){ return r.k; })).forEach(function(k){
    h1 += '<button class="chip'+(state.region===k?" on":"")+'" data-r="'+k+'">'+k+'</button>';
  });
  PRICE_BANDS.forEach(function(k){
    h2 += '<button class="chip'+(state.price===k?" on":"")+'" data-p="'+k+'">'+k+'</button>';
  });
  r1.innerHTML = h1;
  r2.innerHTML = h2;
  Array.prototype.forEach.call(document.querySelectorAll("#fRegion .chip, #fPrice .chip"), function(b){
    b.onclick = function(){
      if(b.dataset.r !== undefined) state.region = b.dataset.r;
      else state.price = b.dataset.p;
      renderFilters(); updateTip();
    };
  });
}

function updateTip(){
  var n = pool().length;
  document.getElementById("tip").textContent = n + " 道菜在池子里 · 转到哪道吃哪道";
  var r = document.getElementById("roll");
  if(!spinning && document.getElementById("result").dataset.done !== "1"){
    r.textContent = "转";
  }
}

var spinning = false, rollTimer = null, deg = 0;
function spin(){
  if(spinning) return;
  var p = pool();
  if(!p.length){
    document.getElementById("result").innerHTML = '<div class="placeholder">这个条件下没有菜，放宽一点试试</div>';
    document.getElementById("result").dataset.done = "";
    return;
  }
  spinning = true;
  var dial = document.getElementById("dial");
  var face = dial.querySelector(".face");
  var roll = document.getElementById("roll");
  var hint = document.getElementById("rollHint");
  document.getElementById("result").innerHTML = "";
  document.getElementById("result").dataset.done = "";
  hint.innerHTML = "正在转…";
  dial.parentNode.classList.add("rolling");
  deg += 1440 + Math.floor(Math.random()*360);
  dial.style.transform = "rotate("+deg+"deg)";
  face.style.transform = "rotate("+(-deg)+"deg)";

  var n = 0;
  rollTimer = setInterval(function(){
    n++;
    var t = p[Math.floor(Math.random()*p.length)];
    roll.textContent = t.dish;
    if(n > 17){
      clearInterval(rollTimer); rollTimer = null;
      spinning = false;
      dial.parentNode.classList.remove("rolling");
      land(p[Math.floor(Math.random()*p.length)]);
    }
  }, 68);
}

function land(d){
  document.getElementById("roll").textContent = d.dish;
  document.getElementById("rollHint").innerHTML = whereText(d) + (d.stall ? "<br>" + d.stall : "");
  var r = document.getElementById("result");
  r.dataset.done = "1";
  var ph = d.img
    ? '<div class="ph"><img src="img/'+d.img+'" alt=""><div class="badge">转到 <span>'+d.stall+'</span></div></div>'
    : '<div class="ph nobhoto">这道菜还没人拍照 · '+d.stall+'</div>';
  r.innerHTML =
    '<div class="res">'+ ph +
      '<div class="body">'+
        '<h2 class="name">'+d.dish+'</h2>'+
        '<div class="where"><i>'+whereText(d)+'</i>'+(d.stall?'<i>'+d.stall+'</i>':'')+'</div>'+
        (d.comment ? '<p class="say">'+d.comment+'</p>' : '')+
        '<div class="meta">'+ priceText(d) +
          (d.score ? '<span class="stars">'+starsOf(d.score)+'</span><span>'+fmt(d.score)+' 分</span>' : '<span>没打分</span>')+
          (d.editor ? '<span style="margin-left:auto">'+d.editor+' 投的</span>' : '')+
        '</div>'+
        '<div class="acts">'+
          '<button class="b-ghost" id="again">换一道</button>'+
          '<button class="b-main" id="toRank">看全部的菜</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.getElementById("again").onclick = spin;
  document.getElementById("toRank").onclick = function(){ switchView("rank"); };
  r.scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ---------- 榜单 ---------- */
function editorsByStall(){
  var m = {};
  ALL.forEach(function(d){
    var k = d.venue + "|" + d.stall;
    m[k] = m[k] || {};
    if(d.editor) m[k][d.editor] = 1;
  });
  var out = {};
  Object.keys(m).forEach(function(k){ out[k] = Object.keys(m[k]).length; });
  return out;
}

function renderRank(){
  var box = document.getElementById("rankList");
  var note = document.getElementById("rankNote");
  var cnt = editorsByStall();
  var multi = ALL.filter(function(d){ return (cnt[d.venue+"|"+d.stall]||1) >= 2; });

  var sorted = ALL.slice().sort(function(a,b){
    var am = (cnt[a.venue+"|"+a.stall]||1)>=2 ? 1 : 0;
    var bm = (cnt[b.venue+"|"+b.stall]||1)>=2 ? 1 : 0;
    if(am !== bm) return bm - am;
    var as = a.score===null?-1:a.score, bs = b.score===null?-1:b.score;
    if(bs !== as) return bs - as;
    var ap = a.price===null?99:a.price, bp = b.price===null?99:b.price;
    return ap - bp;
  });

  if(multi.length){
    note.innerHTML = '<div class="note">同一个档口有两个人评过的，排在前面。</div>';
  }else{
    note.innerHTML = '<div class="note">现在每个档口都只有一个人评过，所以先按评分排。等同一个档口出现第二条评价，会自动插到前面去。</div>';
  }
  document.getElementById("rankN").textContent = sorted.length + " 道";

  box.innerHTML = "";
  sorted.forEach(function(d){
    var el = document.createElement("div");
    el.className = "item";
    var th = d.img
      ? '<div class="thumb"><img loading="lazy" src="img/t/'+d.img+'" alt=""></div>'
      : '<div class="thumb">'+(d.dish||"?").slice(0,1)+'</div>';
    el.innerHTML = th +
      '<div class="b">'+
        '<h3>'+d.dish+(d.score?'<span class="s">'+fmt(d.score)+'</span>':'')+'</h3>'+
        '<p class="l2">'+whereText(d)+' · '+d.stall+'</p>'+
        (d.comment?'<p class="l3">'+d.comment+'</p>':'')+
        '<p class="l4">'+priceText(d).replace(/<[^>]+>/g,'')+(d.editor?' · '+d.editor+' 投的':'')+'</p>'+
      '</div>';
    el.onclick = function(){ showOne(d); };
    box.appendChild(el);
  });
}

function showOne(d){
  switchView("wheel");
  land(d);
}

/* ---------- 食堂 ---------- */
function renderHalls(){
  var groups = {};
  ALL.forEach(function(d){
    var k = d.venue;
    groups[k] = groups[k] || [];
    groups[k].push(d);
  });
  var order = REGION.reduce(function(a,r){ return a.concat(r.m); }, []);
  var venues = Object.keys(groups).sort(function(a,b){
    var ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  var box = document.getElementById("hallList");
  var posSet = {};
  ALL.forEach(function(d){ posSet[d.venue + "|" + (d.floor||"")] = 1; });
  document.getElementById("hallN").textContent =
    venues.length + " 个食堂 · " + Object.keys(posSet).length + " 个位置";

  box.innerHTML = "";
  venues.forEach(function(v){
    var list = groups[v];
    var floors = {};
    list.forEach(function(d){ floors[d.floor||""] = (floors[d.floor||""]||[]).concat(d); });
    var floorKeys = Object.keys(floors).sort();
    var best = Math.max.apply(null, list.map(function(d){ return d.score||0; }));

    var el = document.createElement("div");
    el.className = "venue";
    var inner = "";
    floorKeys.forEach(function(f){
      inner += '<div class="stall" style="border-bottom:0;padding:10px 0 2px"><span class="nm" style="font-weight:700;font-size:12px;color:#a3a6ab">'+
               (f ? f : "档口")+'<em>'+(floors[f].length)+' 道</em></span></div>';
      floors[f].forEach(function(d){
        inner += '<div class="stall"><span class="nm">'+d.dish+(d.score?'<em>'+fmt(d.score)+' 分</em>':'')+
                 '</span><span class="pr">'+(d.price===null?'没写价':'¥'+fmt(d.price))+'</span></div>';
      });
    });
    var preview = list.slice(0,4).map(function(d){ return d.dish; }).join(" / ") +
                  (list.length>4 ? " 等" : "");
    var floorTag = floorKeys.filter(function(f){ return !!f; })
                            .map(function(f){ return '<span class="flr">'+f+'</span>'; }).join("");
    el.innerHTML =
      '<div class="head">'+
        '<div class="t">'+
          '<div class="rowtop"><b>'+v+'</b>'+floorTag+'</div>'+
          '<p>'+list.length+' 道菜 · '+(best ? '最高 '+fmt(best)+' 分' : '都还没打分')+'</p>'+
          '<p class="pv">'+preview+'</p>'+
        '</div>'+
        '<span class="arrow">›</span>'+
      '</div>'+
      '<div class="list">'+inner+'</div>';
    el.querySelector(".head").onclick = function(){ el.classList.toggle("open"); };
    box.appendChild(el);
  });
}

/* ---------- 随手看 ---------- */
function renderPeek(){
  var box = document.getElementById("peek");
  var pick = ALL.filter(function(d){ return d.img; })
                .sort(function(a,b){ return (b.score||0) - (a.score||0); })
                .slice(0, 8);
  box.innerHTML = "";
  pick.forEach(function(d){
    var el = document.createElement("div");
    el.className = "c";
    el.innerHTML =
      '<div class="im"><img loading="lazy" src="img/t/'+d.img+'" alt=""></div>'+
      '<div class="tx"><b>'+d.dish+'</b>'+
        '<span>'+d.venue+(d.floor?' '+d.floor:'')+'</span>'+
        '<span><em>'+(d.price===null?'没写价':'¥'+fmt(d.price))+'</em></span>'+
      '</div>';
    el.onclick = function(){ showOne(d); };
    box.appendChild(el);
  });
}

/* ---------- 视图切换 ---------- */
function switchView(v){
  document.querySelectorAll(".view").forEach(function(s){ s.classList.remove("on"); });
  document.getElementById("v-"+v).classList.add("on");
  document.querySelectorAll(".tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.v===v); });
  window.scrollTo({top:0, behavior:"smooth"});
}
document.querySelectorAll(".tabs button").forEach(function(b){
  b.onclick = function(){ switchView(b.dataset.v); };
});

/* ---------- 我加的菜 ---------- */
function loadExtra(){
  try{
    var a = JSON.parse(localStorage.getItem(EXTRA_KEY) || "[]");
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}
function saveExtra(a){ try{ localStorage.setItem(EXTRA_KEY, JSON.stringify(a)); }catch(e){} }

function rebuild(){
  ALL.length = 0;
  DATA.forEach(function(d){ ALL.push(d); });
  loadExtra().forEach(function(d){ ALL.push(d); });
  document.getElementById("hdrSub").textContent =
    "湖工大食堂 · " + DATA.length + " 道菜 · " + new Set(DATA.map(function(d){return d.editor;}).filter(Boolean)).size + " 位同学投的" +
    (loadExtra().length ? " · 你自己加了 " + loadExtra().length + " 道" : "");
  renderFilters(); updateTip(); renderRank(); renderHalls(); renderPeek();
}

/* ---------- 弹窗 ---------- */
var modal = document.getElementById("modal");
document.getElementById("addBtn").onclick = function(){
  renderMine();
  modal.classList.add("on");
};
document.getElementById("mClose").onclick = function(){ modal.classList.remove("on"); };
modal.addEventListener("click", function(e){ if(e.target === modal) modal.classList.remove("on"); });

function renderVenueOptions(){
  var sel = document.getElementById("mVenue");
  var order = REGION.reduce(function(a,r){ return a.concat(r.m); }, []);
  sel.innerHTML = order.map(function(v){ return '<option>'+v+'</option>'; }).join("");
}
function renderMine(){
  var a = loadExtra();
  var box = document.getElementById("mine");
  if(!a.length){ box.innerHTML = ""; return; }
  var html = '<div style="font-size:12px;color:#7d8087;margin:6px 0 2px">你加的 ' + a.length + ' 道</div>';
  a.forEach(function(d,i){
    html += '<div class="it"><span><b>'+d.dish+'</b> · '+d.venue+'</span><button class="del" data-i="'+i+'">删掉</button></div>';
  });
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll(".del"), function(b){
    b.onclick = function(){
      var a2 = loadExtra(); a2.splice(parseInt(b.dataset.i,10),1); saveExtra(a2);
      rebuild(); renderMine();
    };
  });
}
document.getElementById("mReset").onclick = function(){
  if(!confirm("清掉你自己加过的所有菜？")) return;
  saveExtra([]); rebuild(); renderMine();
};
document.getElementById("mVenue") && renderVenueOptions();

document.getElementById("modal").addEventListener("click", function(e){
  if(e.target.id === "mAdd") addOne();
});
function addOne(){
  var dish = document.getElementById("mDish").value.trim();
  var stall = document.getElementById("mStall").value.trim();
  if(!dish){ alert("至少写个菜名"); return; }
  var pv = document.getElementById("mPrice").value.trim();
  var sv = document.getElementById("mScore").value;
  var d = {
    id:"x"+Date.now(),
    venue:document.getElementById("mVenue").value,
    floor:document.getElementById("mFloor").value,
    stall:stall || "（没写档口）",
    dish:dish,
    price:pv===""?null:parseFloat(pv),
    priceMax:null,
    priceText:pv===""?"没写价格":"",
    price_note:"",
    comment:document.getElementById("mSay").value.trim(),
    score:sv===""?null:parseFloat(sv),
    editor:"我",
    img:"",
    mine:true
  };
  var a = loadExtra(); a.push(d); saveExtra(a);
  rebuild(); renderMine();
  document.getElementById("mDish").value = "";
  document.getElementById("mStall").value = "";
  document.getElementById("mPrice").value = "";
  document.getElementById("mSay").value = "";
}

/* ---------- 启动 ---------- */
function renderNotice(){
  var box = document.getElementById("notice");
  var items = "菜名 · 档口 · 哪个食堂几楼 · 价格 · 一句话";
  var html = "<b>想让全校都看到？</b>把 " + items + " 发到群里，我统一整理进榜单，下一版就有。";
  if(CONTACT.group){
    html += '<div class="row"><button class="copy" data-copy="' + CONTACT.group + '">复制群号 ' + CONTACT.group + "</button><span class=\"ok\"></span></div>";
  }
  if(CONTACT.qq){
    html += '<div class="row"><button class="copy" data-copy="' + CONTACT.qq + '">复制 QQ ' + CONTACT.qq + "</button><span class=\"ok\"></span></div>";
  }
  if(!CONTACT.group && !CONTACT.qq) html += '<div style="margin-top:6px">群里喊一声就行。</div>';
  box.innerHTML = html;

  Array.prototype.forEach.call(box.querySelectorAll(".copy"), function(b){
    b.onclick = function(){
      var ok = b.parentNode.querySelector(".ok");
      var v = b.getAttribute("data-copy");
      var done = function(){ ok.textContent = "已复制"; setTimeout(function(){ ok.textContent = ""; }, 1600); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(v).then(done, function(){ fallbackCopy(v); done(); });
      }else{ fallbackCopy(v); done(); }
    };
  });
}
function fallbackCopy(t){
  var ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.left = "-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
renderNotice();
document.getElementById("dial").onclick = spin;
document.getElementById("foot").innerHTML =
  (CONTACT.group ? '投稿、报错、说价格变了 → QQ 群 <b style="color:#8b8f94;font-weight:500">' + CONTACT.group + "</b>"
              : "投稿、报错、说价格变了 → 发到群里就行") + "<br>" +
  "数据来自 QQ 群投稿，只记菜不记人<br>" +
  "价格是投稿时的，可能变了 · 图上都是投稿人自己拍的<br>" +
  "这页不联网、不存服务器，你加的菜只在自己手机里";

rebuild();
